[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valhalla"
version = "0.1.0"
description = "Signal engine separating manipulated from organic on-chain trading (funding graph + wash detection)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["valhalla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
